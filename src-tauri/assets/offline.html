<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>WhatsApp</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #202020;
        color: #ffffff;
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Cantarell, Ubuntu, sans-serif;
      }
      .card {
        width: min(420px, 90vw);
        padding: 32px;
        border-radius: 8px;
        background: #2c2c2c;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        text-align: center;
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #005a4e;
        font-size: 28px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 600;
      }
      p {
        margin: 0 0 24px;
        color: #a1a1a1;
        font-size: 14px;
        line-height: 1.5;
      }
      button {
        padding: 8px 20px;
        border: 0;
        border-radius: 4px;
        background: #00a884;
        color: #111b21;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #06cf9c;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">⚡</div>
      <h1>Sem conexão com o WhatsApp</h1>
      <p>Verifique sua conexão com a internet. Vamos tentar novamente automaticamente em alguns segundos.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
    <script>
      setTimeout(() => location.reload(), 15000);
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
